<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: "Segoe UI", Tahoma, sans-serif;
    color: #1f2937;
}

.prompt-box {
    position: relative;
    box-sizing: border-box;
    width: 100%;
    background: #f0f4fb;
    border: 1px solid rgba(0, 51, 160, 0.18);
    border-radius: 8px;
    padding: 12px 16px 20px 16px;
    font-size: 10pt;
    line-height: 1.6;
}

.prompt-text {
    white-space: pre-wrap;
}

.copy-button {
    position: absolute;
    right: 8px;
    bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: #4b5563;
    cursor: pointer;
}

.copy-button:hover:not(:disabled) {
    background: rgba(0, 51, 160, 0.08);
    color: #0033a0;
}

.copy-button:disabled {
    cursor: not-allowed;
}

.copy-button svg {
    width: 17px;
    height: 17px;
}

.prompt-error {
    color: #b91c1c;
    font-weight: 600;
}
</style>
</head>

<body>

<div class="prompt-box" id="promptBox">

    <div class="prompt-text" id="promptText"></div>

    <button
        class="copy-button"
        id="copyButton"
        type="button"
        title="Copy prompt"
        aria-label="Copy prompt">

        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>

    </button>

</div>

<script src="prompts.js"></script>

<script>

/* ==========================================================
   IDENTIFY REQUESTED PROMPT
========================================================== */

const params = new URLSearchParams(window.location.search);
const promptID = params.get("id");

const promptText = document.getElementById("promptText");
const copyButton = document.getElementById("copyButton");

let text = "";
let promptExists = false;


/* ==========================================================
   LOAD PROMPT OR DISPLAY ERROR
========================================================== */

if (!promptID) {

    promptText.textContent = "Prompt ID missing.";
    promptText.classList.add("prompt-error");

    copyButton.disabled = true;
    copyButton.style.color = "#b91c1c";

    copyButton.innerHTML = `
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2.5"
             stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M18 6L6 18"></path>
            <path d="M6 6l12 12"></path>
        </svg>
    `;

    copyButton.title = "Prompt ID missing";
    copyButton.setAttribute("aria-label", "Prompt ID missing");

} else if (!prompts[promptID]) {

    promptText.textContent = `Prompt not found: ${promptID}`;
    promptText.classList.add("prompt-error");

    copyButton.disabled = true;
    copyButton.style.color = "#b91c1c";

    copyButton.innerHTML = `
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2.5"
             stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M18 6L6 18"></path>
            <path d="M6 6l12 12"></path>
        </svg>
    `;

    copyButton.title = "Prompt not found";
    copyButton.setAttribute("aria-label", "Prompt not found");

} else {

    const prompt = prompts[promptID];

    promptExists = true;
    text = prompt.text;

    promptText.textContent = text;

    if (prompt.title) {
        document.title = prompt.title;
    }

}


/* ==========================================================
   COPY BUTTON
========================================================== */

copyButton.addEventListener("click", async () => {

    if (!promptExists) {
        return;
    }

    try {

        await navigator.clipboard.writeText(text);

        copyButton.innerHTML = `
            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2.5"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <path d="M20 6L9 17l-5-5"></path>
            </svg>
        `;

        copyButton.title = "Copied";
        copyButton.setAttribute("aria-label", "Copied");

        setTimeout(() => {

            copyButton.innerHTML = `
                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            `;

            copyButton.title = "Copy prompt";
            copyButton.setAttribute("aria-label", "Copy prompt");

        }, 1200);

    } catch (err) {

        copyButton.innerHTML = `
            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="#b91c1c"
                 stroke-width="2.5"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <path d="M18 6L6 18"></path>
                <path d="M6 6l12 12"></path>
            </svg>
        `;

        copyButton.title = "Copy failed";
        copyButton.setAttribute("aria-label", "Copy failed");

        setTimeout(() => {

            copyButton.innerHTML = `
                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            `;

            copyButton.title = "Copy prompt";
            copyButton.setAttribute("aria-label", "Copy prompt");

        }, 1500);

    }

});


/* ==========================================================
   AUTOMATIC CANVAS IFRAME HEIGHT
========================================================== */

let lastHeight = 0;

function resizeCanvasFrame() {

    const promptBox = document.getElementById("promptBox");

    const height = Math.ceil(
        promptBox.getBoundingClientRect().height
    );

    if (height === lastHeight) {
        return;
    }

    lastHeight = height;

    window.parent.postMessage(
        {
            subject: "lti.frameResize",
            height: height
        },
        "*"
    );

}


/* Initial sizing */
window.addEventListener("load", () => {

    requestAnimationFrame(() => {
        resizeCanvasFrame();
    });

});


/* Recalculate when width/layout changes */
const resizeObserver = new ResizeObserver(() => {
    resizeCanvasFrame();
});

resizeObserver.observe(document.documentElement);

</script>

</body>
</html>
