<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,
body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: "Segoe UI", Tahoma, sans-serif;
    color: #1f2937;
}

.prompt-container {
    position: relative;
    box-sizing: border-box;
    width: 100%;
    margin: 0;
    padding: 0 0 20px 0;
    background: transparent;
    font-size: 10pt;
    line-height: 1.6;
}

.prompt-text {
    white-space: pre-wrap;
}

.copy-button {
    position: absolute;
    right: 0;
    bottom: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    width: 32px;
    height: 32px;

    padding: 0;
    border: 0;
    border-radius: 5px;

    background: transparent;
    color: #4b5563;
    cursor: pointer;
}

.copy-button:hover:not(:disabled) {
    background: rgba(0, 51, 160, 0.08);
    color: #0033a0;
}

.copy-button:disabled {
    cursor: not-allowed;
}

.copy-button svg {
    width: 17px;
    height: 17px;
}

.prompt-error {
    color: #b91c1c;
    font-weight: 600;
}
</style>
</head>

<body>

<div class="prompt-container" id="promptContainer">

    <div class="prompt-text" id="promptText">Loading prompt...</div>

    <button
        class="copy-button"
        id="copyButton"
        type="button"
        title="Copy prompt"
        aria-label="Copy prompt"
        disabled>

        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>

    </button>

</div>

<script>

/* ==========================================================
   CONFIGURATION
========================================================== */

const NOTIFICATION_URL =
    "https://script.google.com/macros/s/AKfycbyljlO43mbSLOGCEeYgFGGXH24Ov4iXlydo_YS1fI7mnW8IFCkPK9cJq6QAIyy4rUDN/exec";


/* ==========================================================
   BASIC REFERENCES
========================================================== */

const params = new URLSearchParams(window.location.search);

const promptID = params.get("id");
const course = params.get("course") || "Unknown course";

const promptContainer = document.getElementById("promptContainer");
const promptText = document.getElementById("promptText");
const copyButton = document.getElementById("copyButton");

let text = "";
let promptExists = false;


/* ==========================================================
   ICON HELPERS
========================================================== */

function showCopyIcon() {

    copyButton.innerHTML = `
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
    `;

    copyButton.style.color = "#4b5563";
    copyButton.title = "Copy prompt";
    copyButton.setAttribute("aria-label", "Copy prompt");
}


function showCheckIcon() {

    copyButton.innerHTML = `
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2.5"
             stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"></path>
        </svg>
    `;

    copyButton.style.color = "#4b5563";
    copyButton.title = "Copied";
    copyButton.setAttribute("aria-label", "Copied");
}


function showErrorIcon(message) {

    copyButton.innerHTML = `
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2.5"
             stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M18 6L6 18"></path>
            <path d="M6 6l12 12"></path>
        </svg>
    `;

    copyButton.style.color = "#b91c1c";
    copyButton.title = message;
    copyButton.setAttribute("aria-label", message);
}


/* ==========================================================
   ERROR HANDLING
========================================================== */

function displayError(message) {

    promptExists = false;
    text = "";

    promptText.textContent = message;
    promptText.classList.add("prompt-error");

    copyButton.disabled = true;

    showErrorIcon(message);

    resizeCanvasFrame();
}


/* ==========================================================
   INITIALIZE REQUESTED PROMPT
========================================================== */

function initializePrompt() {

    if (!promptID) {
        displayError("Prompt ID missing.");
        return;
    }

    if (typeof prompts === "undefined") {
        displayError("Prompt library could not be loaded.");
        return;
    }

    const prompt = prompts[promptID];

    if (!prompt) {
        displayError(`Prompt not found: ${promptID}`);
        return;
    }

    promptExists = true;
    text = prompt.text;

    promptText.classList.remove("prompt-error");
    promptText.textContent = text;

    copyButton.disabled = false;

    showCopyIcon();

    if (prompt.title) {
        document.title = prompt.title;
    }

    requestAnimationFrame(() => {
        resizeCanvasFrame();
    });
}


/* ==========================================================
   COPY NOTIFICATION
========================================================== */

function notifyCopy() {

    const data = new URLSearchParams();

    data.append("promptId", promptID);
    data.append("course", course);

    fetch(
        NOTIFICATION_URL,
        {
            method: "POST",
            mode: "no-cors",
            body: data
        }
    ).catch(() => {

        /*
          Notification failure should never interfere
          with the student's copy operation.
        */

    });
}


/* ==========================================================
   COPY BUTTON
========================================================== */

copyButton.addEventListener("click", async () => {

    if (!promptExists) {
        return;
    }

    try {

        await navigator.clipboard.writeText(text);

        /*
          Count the event only after the clipboard
          operation succeeds.
        */
        notifyCopy();

        showCheckIcon();

        setTimeout(() => {
            showCopyIcon();
        }, 1200);

    } catch (err) {

        showErrorIcon("Copy failed");

        setTimeout(() => {
            showCopyIcon();
        }, 1500);

    }

});


/* ==========================================================
   AUTOMATIC CANVAS IFRAME HEIGHT
========================================================== */

let lastHeight = 0;

function resizeCanvasFrame() {

    const height = Math.ceil(
        promptContainer.getBoundingClientRect().height
    );

    if (height === lastHeight) {
        return;
    }

    lastHeight = height;

    window.parent.postMessage(
        {
            subject: "lti.frameResize",
            height: height
        },
        "*"
    );
}


/* ==========================================================
   LOAD prompts.js FRESH EACH TIME
========================================================== */

function loadPromptLibrary() {

    const script = document.createElement("script");

    /*
      Cache-busting timestamp ensures that students receive
      the currently published prompts.js rather than an older
      browser-cached copy.
    */
    script.src = "prompts.js?v=" + Date.now();

    script.onload = () => {
        initializePrompt();
    };

    script.onerror = () => {
        displayError("Prompt library could not be loaded.");
    };

    document.head.appendChild(script);
}


/* ==========================================================
   INITIALIZATION
========================================================== */

window.addEventListener("load", () => {
    loadPromptLibrary();
});


/*
  Recalculate height whenever wrapping/layout changes.
*/
const resizeObserver = new ResizeObserver(() => {
    resizeCanvasFrame();
});

resizeObserver.observe(document.documentElement);

</script>

</body>
</html>
