<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,
body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: "Segoe UI", Tahoma, sans-serif;
    color: #1f2937;
}

.prompt-box {
    position: relative;
    box-sizing: border-box;
    width: 100%;

    background-color: #eef4ff;
    border: 1px solid #c7d2fe;
    border-radius: 8px;

    padding: 12px 16px 20px 16px;
    font-size: 10pt;
    line-height: 1.6;
}

.prompt-text {
    white-space: pre-wrap;
}

.prompt-text strong {
    font-weight: 700;
}

.copy-button {
    position: absolute;
    right: 8px;
    bottom: 6px;

    display: flex;
    align-items: center;
    justify-content: center;

    width: 32px;
    height: 32px;

    padding: 0;
    border: 0;
    border-radius: 5px;

    background: transparent;
    color: #4b5563;
    cursor: pointer;
}

.copy-button:hover:not(:disabled) {
    background: rgba(0, 51, 160, 0.08);
    color: #0033a0;
}

.copy-button:disabled {
    cursor: not-allowed;
}

.copy-button svg {
    width: 17px;
    height: 17px;
}

.prompt-error {
    color: #b91c1c;
    font-weight: 600;
}
</style>
</head>

<body>

<div class="prompt-box" id="promptBox">

    <div class="prompt-text" id="promptText">Loading prompt...</div>

    <button
        class="copy-button"
        id="copyButton"
        type="button"
        title="Copy prompt"
        aria-label="Copy prompt"
        disabled>

        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>

    </button>

</div>

<script>
const NOTIFICATION_URL =
    "https://script.google.com/macros/s/AKfycbyljlO43mbSLOGCEeYgFGGXH24Ov4iXlydo_YS1fI7mnW8IFCkPK9cJq6QAIyy4rUDN/exec";

const params = new URLSearchParams(window.location.search);

const promptID = params.get("id");
const course = params.get("course") || "Unknown course";

const promptBox = document.getElementById("promptBox");
const promptText = document.getElementById("promptText");
const copyButton = document.getElementById("copyButton");

let text = "";
let promptExists = false;


/* ==========================================================
   FORMAT PROMPT
========================================================== */

function escapeHTML(value) {

    return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatPromptForDisplay(value) {

    return escapeHTML(value)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}


function formatPromptForClipboard(value) {

    return value.replace(/\*\*(.+?)\*\*/g, "$1");
}


/* ==========================================================
   ICONS
========================================================== */

function showCopyIcon() {

    copyButton.innerHTML = `
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
    `;

    copyButton.style.color = "#4b5563";
    copyButton.title = "Copy prompt";
    copyButton.setAttribute("aria-label", "Copy prompt");
}


function showCheckIcon() {

    copyButton.innerHTML = `
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2.5"
             stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"></path>
        </svg>
    `;

    copyButton.style.color = "#4b5563";
    copyButton.title = "Copied";
    copyButton.setAttribute("aria-label", "Copied");
}


function showErrorIcon(message) {

    copyButton.innerHTML = `
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2.5"
             stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M18 6L6 18"></path>
            <path d="M6 6l12 12"></path>
        </svg>
    `;

    copyButton.style.color = "#b91c1c";
    copyButton.title = message;
    copyButton.setAttribute("aria-label", message);
}


/* ==========================================================
   RESIZE CANVAS IFRAME
========================================================== */

function resizeCanvasFrame() {

    const height = Math.ceil(
        promptBox.getBoundingClientRect().height
    );

    window.parent.postMessage(
        {
            subject: "lti.frameResize",
            height: height
        },
        "*"
    );
}


function scheduleResize() {

    requestAnimationFrame(resizeCanvasFrame);

    setTimeout(resizeCanvasFrame, 100);
    setTimeout(resizeCanvasFrame, 300);
    setTimeout(resizeCanvasFrame, 700);
}


/* ==========================================================
   ERRORS
========================================================== */

function displayError(message) {

    promptExists = false;
    text = "";

    promptText.textContent = message;
    promptText.classList.add("prompt-error");

    copyButton.disabled = true;

    showErrorIcon(message);

    scheduleResize();
}


/* ==========================================================
   LOAD PROMPT
========================================================== */

function initializePrompt() {

    if (!promptID) {
        displayError("Prompt ID missing.");
        return;
    }

    if (typeof prompts === "undefined") {
        displayError("Prompt library could not be loaded.");
        return;
    }

    const prompt = prompts[promptID];

    if (!prompt) {
        displayError(`Prompt not found: ${promptID}`);
        return;
    }

    promptExists = true;
    text = prompt.text;

    promptText.classList.remove("prompt-error");

    /*
       Display **text** as bold while preserving all original
       line breaks and spacing in the prompt.
    */
    promptText.innerHTML = formatPromptForDisplay(text);

    copyButton.disabled = false;

    showCopyIcon();

    if (prompt.title) {
        document.title = prompt.title;
    }

    scheduleResize();
}


/* ==========================================================
   EMAIL NOTIFICATION
========================================================== */

function notifyCopy() {

    const data = new URLSearchParams();

    data.append("promptId", promptID);
    data.append("course", course);

    fetch(
        NOTIFICATION_URL,
        {
            method: "POST",
            mode: "no-cors",
            body: data
        }
    ).catch(() => {

        /* Notification failure does not affect copying */

    });
}


/* ==========================================================
   COPY
========================================================== */

copyButton.addEventListener("click", async () => {

    if (!promptExists) {
        return;
    }

    try {

        /*
           Copy clean plain text. The ** markers used only
           for visual formatting are removed.
        */
        await navigator.clipboard.writeText(
            formatPromptForClipboard(text)
        );

        notifyCopy();

        showCheckIcon();

        setTimeout(() => {
            showCopyIcon();
        }, 1200);

    } catch (err) {

        showErrorIcon("Copy failed");

        setTimeout(() => {
            showCopyIcon();
        }, 1500);

    }

});


/* ==========================================================
   LOAD CURRENT prompts.js
========================================================== */

function loadPromptLibrary() {

    const script = document.createElement("script");

    script.src = "prompts.js?v=" + Date.now();

    script.onload = initializePrompt;

    script.onerror = () => {
        displayError("Prompt library could not be loaded.");
    };

    document.head.appendChild(script);
}


/* ==========================================================
   RESPONSIVE HEIGHT
========================================================== */

window.addEventListener("load", loadPromptLibrary);
window.addEventListener("resize", scheduleResize);

const resizeObserver = new ResizeObserver(() => {
    scheduleResize();
});

resizeObserver.observe(promptBox);

</script>

</body>
</html>
